<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zorunlu Şifre Değişikliği - NİZ Ayar Evi</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
    body { background-color: #0f172a; color: #f8fafc; }
    .card-box { max-width: 420px; background-color: #1e293b; border: 1px solid #334155; border-radius: 16px; }
</style>
</head>
<body class="d-flex align-items-center min-vh-100 py-4">
<div class="container">
    <div class="card card-box mx-auto p-4 shadow">
        <h4 class="text-warning text-center fw-bold">Yeni Şifre Belirleyin</h4>
        <p class="text-secondary text-center small mb-4">Güvenliğiniz için lütfen ilk girişte yeni bir şifre tanımlayınız.</p>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-warning py-2 small">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label text-secondary small">Yeni Şifre</label>
                <input type="password" name="yeni_sifre" class="form-control bg-dark text-white border-secondary" required minlength="6">
            </div>
            <div class="mb-4">
                <label class="form-label text-secondary small">Yeni Şifre (Tekrar)</label>
                <input type="password" name="yeni_sifre_tekrar" class="form-control bg-dark text-white border-secondary" required minlength="6">
            </div>
            <button type="submit" class="btn btn-warning w-100 py-2 fw-semibold">Şifremi Güncelle ve Panele Geç</button>
        </form>
    </div>
</div>
</body>
</html>
