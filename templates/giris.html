{% load static %}
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Müşteri Giriş Portalı - NİZ Ayar Evi</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
    body {
        background-color: #0b1120;
        color: #f8fafc;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, sans-serif;
        margin: 0;
        padding: 20px;
    }
    .login-card {
        background: linear-gradient(145deg, #111827, #1e293b);
        border: 1px solid #334155;
        border-radius: 16px;
        width: 100%;
        max-width: 420px;
        padding: 38px 32px 30px 32px;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
    }
    
    /* Altın sarısına dönüştürülmüş ortalı logo */
    .login-logo {
        max-height: 85px;
        width: auto;
        filter: invert(74%) sepia(42%) saturate(942%) hue-rotate(359deg) brightness(91%) contrast(89%);
        display: block;
        margin: 0 auto 10px auto;
    }
    
    .form-control {
        background-color: #0f172a;
        border: 1px solid #334155;
        color: #ffffff;
        border-radius: 8px;
        padding: 10px 14px;
    }
    .form-control:focus {
        background-color: #0f172a;
        border-color: #d4af37;
        color: #ffffff;
        box-shadow: 0 0 0 0.25rem rgba(212, 175, 55, 0.2);
    }
    .btn-gold {
        background: linear-gradient(135deg, #d4af37, #aa820a);
        border: none;
        color: #ffffff;
        font-weight: 600;
        padding: 11px;
        border-radius: 8px;
        transition: all 0.2s ease;
    }
    .btn-gold:hover {
        background: linear-gradient(135deg, #e5be48, #c29511);
        color: #ffffff;
    }
    .back-link {
        color: #94a3b8;
        text-decoration: none;
        font-size: 13px;
        transition: color 0.2s;
    }
    .back-link:hover {
        color: #d4af37;
    }
</style>
</head>
<body>

<div class="login-card text-center">
    <!-- Altın Sarısı Logo -->
    <a href="{% url 'anasayfa' %}">
        <img src="{% static 'images/logo.png' %}" alt="Niz Ayar Evi" class="login-logo">
    </a>
    <p class="text-secondary small mb-4">Müşteri Rapor Giriş Portalı</p>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-danger py-2 small mb-3 text-start" role="alert">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="post" action="{% url 'giris' %}" class="text-start">
        {% csrf_token %}
        <div class="mb-3">
            <label for="username" class="form-label text-secondary small">Kullanıcı Adı</label>
            <input type="text" class="form-control" id="username" name="username" value="{{ varsayilan_kullanici }}" required autofocus>
        </div>
        <div class="mb-4">
            <label for="password" class="form-label text-secondary small">Şifre</label>
            <input type="password" class="form-control" id="password" name="password" required>
        </div>
        <button type="submit" class="btn btn-gold w-100 mb-3">Giriş Yap</button>
    </form>

    <div class="mt-2">
        <a href="{% url 'anasayfa' %}" class="back-link">← Ana Sayfaya Dön</a>
    </div>
</div>

</body>
</html>
